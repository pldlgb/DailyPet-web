#gate .logo {

}

	margin: 18px 0 4px;
	font-size: 30px;
	letter-spacing: 2px;
	color: #ffd27a;
	text-shadow: 0 3px 0 #9a3042, 0 -1px 0 #9a3042, 2px 0 0 #9a3042, -2px 0 0 #9a3042;
}

#gate .sub {
	margin: 0 0 26px;
	font-size: 14px;
	opacity: 0.8;
}

#gate .bar {
	height: 14px;
	border: 3px solid #fbe3c4;
	border-radius: 4px;
	padding: 2px;
	box-sizing: border-box;
}

#gate .bar > div {
	height: 100%;
	width: 0;
	background: #7ccf5b;
	transition: width 0.15s linear;
}

#gate .msg {
	margin-top: 10px;
	min-height: 20px;
	font-size: 14px;
}

#gate .start {
	display: none;
	margin: 0 auto;
	padding: 12px 34px;
	font: inherit;
	font-size: 22px;
	font-weight: bold;
	letter-spacing: 4px;
	color: #fff;
	background: #5cb85c;
	border: 3px solid #2f5a2a;
	border-radius: 6px;
	box-shadow: inset 0 -5px 0 #3e8e41, 0 4px 0 rgba(0, 0, 0, 0.35);
	cursor: pointer;
	animation: pulse 1.2s ease-in-out infinite;
}

#gate.ready .start {
	display: block;
}

#gate.ready .bar,
#gate.ready .msg {
	display: none;
}

#gate .tip {
	margin-top: 22px;
	font-size: 12px;
	opacity: 0.6;
}

#gate .ios-tip {
	display: none;
	margin-top: 10px;
	font-size: 12px;
	line-height: 1.5;
	opacity: 0.75;
}

#gate.ios-browser .ios-tip {
	display: block;
}

#gate.error .bar,
#gate.error .start {
	display: none;
}

#gate.error .msg {
	color: #ffb3b3;
	white-space: pre-line;
	line-height: 1.5;
}

@keyframes hop {
	0%, 100% { transform: translateY(0); }
	50% { transform: translateY(-6px); }
}

@keyframes pulse {
	0%, 100% { transform: scale(1); }
	50% { transform: scale(1.06); }
}

// Godot builds the apple-touch-icon from the project icon (rounded, transparent outside the corners), and iOS
// fills transparent pixels with black on the home screen. Point it at the full-bleed PWA icon instead.
(function () {
	const touchIcon = document.querySelector('link[rel="apple-touch-icon"]');
	const manifest = document.querySelector('link[rel="manifest"]');
	if (touchIcon && manifest) {
		touchIcon.href = manifest.getAttribute('href').replace(/\.manifest\.json$/, '.180x180.png');
	}
}());

// The engine creates its AudioContext while loading, before any user gesture, so mobile browsers keep it
// suspended. Keep a handle so the "点击开始" tap can resume it from inside the gesture.
const audioContexts = [];
(function () {
	const NativeAudioContext = window.AudioContext || window.webkitAudioContext;
	if (!NativeAudioContext) {
		return;
	}
	const Tracked = function (...args) {
		const ctx = new NativeAudioContext(...args);
		audioContexts.push(ctx);
		return ctx;
	};
	Tracked.prototype = NativeAudioContext.prototype;
	window.AudioContext = Tracked;
	if (window.webkitAudioContext) {
		window.webkitAudioContext = Tracked;
	}
	// iOS Safari mutes Web Audio while the ring/silent switch is on unless the page asks for playback.
	if (navigator.audioSession) {
		navigator.audioSession.type = 'playback';
	}
}());

// iOS suspends (or "interrupts") audio when the page is hidden, the phone locks, or a call/Siri comes in, and only
// lets it resume from a user gesture. Silence everything while hidden and resume on the next touch or key.
function resumeAudio() {
	audioContexts.forEach((ctx) => {
		if (ctx.state !== 'running' && ctx.state !== 'closed') {
			ctx.resume().catch(() => {});
		}
	});
}
['touchend', 'pointerdown', 'keydown'].forEach((type) => {
	document.addEventListener(type, () => {
		if (window.dailypetAudioUnlocked) {
			resumeAudio();
		}
	}, { capture: true, passive: true });
});
document.addEventListener('visibilitychange', () => {
	if (document.hidden) {
		audioContexts.forEach((ctx) => {
			if (ctx.state === 'running') {
				ctx.suspend().catch(() => {});
			}
		});
	} else if (window.dailypetAudioUnlocked) {
		resumeAudio();
	}
});

// Background music (scripts/audio/music.gd): the browser fetches and decodes web/music/*.mp3 itself, so the
// wasm main thread never decodes a 50 s track. Each file is the loop body plus one second of its own start, so
// looping [loopStart, loopEnd) is seamless no matter how much encoder delay the browser's decoder keeps.
// Its own AudioContext is created here, before any gesture, and is unlocked by the same "点击开始" tap.
window.dailypetMusic = (function () {
	const Ctx = window.AudioContext || window.webkitAudioContext;
	if (!Ctx) {
		return undefined;
	}
	const ctx = new Ctx();
	const master = ctx.createGain();
	master.gain.value = 0;
	master.connect(ctx.destination);
	// Decoded tracks are ~17 MB each; keep the few most recent (menu, level, result).
	const MAX_CACHED = 3;
	const cache = new Map();
	let current = null;
	let token = 0;
	function decode(url) {
		let p = cache.get(url);
		if (p) {
			cache.delete(url);
			cache.set(url, p);
			return p;
		}
		p = fetch(url).then((r) => {
			if (!r.ok) {
				throw new Error(`HTTP ${r.status}`);
			}
			return r.arrayBuffer();
		}).then((data) => new Promise((resolve, reject) => ctx.decodeAudioData(data, resolve, reject)));
		p.catch(() => cache.delete(url));
		cache.set(url, p);
		while (cache.size > MAX_CACHED) {
			cache.delete(cache.keys().next().value);
		}
		return p;
	}
	function fadeOut(voice, sec) {
		const t = ctx.currentTime;
		const g = voice.gain.gain;
		g.cancelScheduledValues(t);
		g.setValueAtTime(g.value, t);
		g.linearRampToValueAtTime(0, t + sec);
		voice.src.stop(t + sec + 0.05);
	}
	return {
		play(id, url, loopStart, loopEnd, fade) {
			const mine = ++token;
			if (current) {
				fadeOut(current, fade);
				current = null;
			}
			decode(url).then((buf) => {
				if (mine !== token) {
					return;
				}
				const src = ctx.createBufferSource();
				src.buffer = buf;
				src.loop = true;
				src.loopStart = loopStart;
				src.loopEnd = Math.min(loopEnd, buf.duration);
				const gain = ctx.createGain();
				const t = ctx.currentTime;
				gain.gain.setValueAtTime(0, t);
				gain.gain.linearRampToValueAtTime(1, t + fade);
				src.connect(gain);
				gain.connect(master);
				src.start(t);
				current = { id, src, gain };
			}, (err) => console.warn(`music ${id}:`, err));
		},
		stop(fade) {
			token++;
			if (current) {
				fadeOut(current, fade);
				current = null;
			}
		},
		volume(v) {
			const t = ctx.currentTime;
			master.gain.cancelScheduledValues(t);
			master.gain.setTargetAtTime(v, t, 0.05);
		},
		state() {
			return `${ctx.state}:${current ? current.id : ''}`;
		},
	};
}());

// so testers would keep getting an old build after an update; don't register it.
delete GODOT_CONFIG['serviceWorker'];
const engine = new Engine(GODOT_CONFIG);

(function () {
	const canvas = document.getElementById('canvas');
	const gate = document.getElementById('gate');
	const bar = gate.querySelector('.bar > div');
	const msg = gate.querySelector('.msg');
	const logo = gate.querySelector('.logo');

	const touchIcon = document.querySelector('link[rel="apple-touch-icon"]') || document.querySelector('link[rel~="icon"]');
	if (touchIcon) {
		logo.src = touchIcon.href;
	} else {
		logo.remove();
	}

	// The export uses canvas resize policy "None", so the page owns the canvas size. The game lays out at a
	// logical width of 1080 and grows downwards on taller screens (iPhone 19.5:9), so the canvas fills the
	// whole safe area, but never gets wider than 9:16 (desktop browsers get a centred phone-shaped column).
	// The body is padded by the safe-area insets (notch, home indicator), so fit inside its content box.
	const MAX_ASPECT = 9 / 16;
	function fitCanvas() {
		const dpr = window.devicePixelRatio || 1;
		const pad = getComputedStyle(document.body);
		const availW = window.innerWidth - parseFloat(pad.paddingLeft) - parseFloat(pad.paddingRight);
		const availH = window.innerHeight - parseFloat(pad.paddingTop) - parseFloat(pad.paddingBottom);
		const ch = Math.max(1, Math.floor(availH * dpr));
		const cw = Math.max(1, Math.min(Math.floor(availW * dpr), Math.round(ch * MAX_ASPECT)));
		if (canvas.width !== cw || canvas.height !== ch) {
			canvas.width = cw;
			canvas.height = ch;
		}
		canvas.style.width = `${cw / dpr}px`;
		canvas.style.height = `${ch / dpr}px`;
	}
	fitCanvas();
	window.addEventListener('resize', fitCanvas);
	window.addEventListener('orientationchange', () => setTimeout(fitCanvas, 100));
	if (window.visualViewport) {
		window.visualViewport.addEventListener('resize', fitCanvas);
	}
	// Safari ignores user-scalable=no; its pinch gesture events have to be cancelled directly.
	['gesturestart', 'gesturechange', 'gestureend'].forEach((type) => {
		document.addEventListener(type, (e) => e.preventDefault());
	});

	const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
	if (isIOS && !navigator.standalone) {
		gate.classList.add('ios-browser');
		if (/MicroMessenger/i.test(navigator.userAgent)) {
			gate.querySelector('.ios-tip').textContent = '在微信里打开的话，建议点右上角「…」→「在 Safari 中打开」';
		}
	}

	function fail(text) {
		gate.classList.remove('ready');
		gate.classList.add('error');
		msg.textContent = text;
	}

	let started = false;
	function start() {
		if (started || !gate.classList.contains('ready')) {
			return;
		}
		started = true;
		window.dailypetAudioUnlocked = true;
		resumeAudio();
		gate.classList.add('leaving');
		setTimeout(() => gate.remove(), 300);
		canvas.focus();

	gate.addEventListener('click', start);
	window.addEventListener('keydown', (e) => {
		if (e.key === 'Enter' || e.key === ' ') {
			start();
		}
	});

	const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
	if (missing.length !== 0) {
		fail(`这个浏览器无法运行游戏，缺少：\n${missing.join('\n')}\n\n请换用最新版 Chrome、Safari 或 Edge 打开。`);
		return;
	}

	engine.startGame({
		'onProgress': function (current, total) {
			if (current > 0 && total > 0) {
				const pct = Math.min(100, Math.floor((current / total) * 100));
				bar.style.width = `${pct}%`;
				msg.textContent = pct < 100 ? `加载中… ${pct}%` : '正在启动…';
			}
		},
	}).then(() => {
		fitCanvas();
		gate.classList.add('ready');
	}, (err) => {
		console.error(err);
		fail(`加载失败，请刷新重试。\n${err && err.message ? err.message : err}`);
	});
}());
